[project]
name = "talent-flow"
version = "0.2.0"
description = "人才流动网络分析工具 - 从招聘数据中提取企业员工流动网络，支持时间序列预测"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Yang Liu", email = "your.email@example.com"}
]
keywords = ["talent-flow", "network-analysis", "time-series", "forecasting", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "scikit-learn>=1.6.1",
    "tqdm>=4.68.1",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/talent-flow"
Repository = "https://github.com/yourusername/talent-flow"
Issues = "https://github.com/yourusername/talent-flow/issues"

[project.scripts]
talent-flow = "preprocess:main"

[project.optional-dependencies]
forecast = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]
dl = [
    "torch>=2.0.0",
    "statsmodels>=0.14.0",
    "networkx>=3.0",
    "python-louvain>=0.16",
]
all = [
    "torch>=2.0.0",
    "statsmodels>=0.14.0",
    "networkx>=3.0",
    "python-louvain>=0.16",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
default-groups = ["dev"]
